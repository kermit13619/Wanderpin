<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wanderpin</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #f4f1ea; --panel: #fbfaf6; --ink: #1f2420; --muted: #6b716a; --line: #dcd7cc;
    --accent: #c4532d; --accent-ink: #fff; --ok: #3d7a4f; --warn: #b8862b; --bad: #b03a2e;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161816; --panel: #1e211e; --ink: #e8e6df; --muted: #999e96; --line: #333832;
      --accent: #e0703f; --accent-ink: #160c07;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-columns: 340px 1fr; height: 100vh;
  }
  aside {
    background: var(--panel); border-right: 1px solid var(--line);
    overflow-y: auto; padding: 20px 18px 28px; display: flex; flex-direction: column; gap: 22px;
  }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }
  h2 { font-size: 13px; font-weight: 600; margin: 0 0 8px; color: var(--muted); }
  section { display: flex; flex-direction: column; gap: 8px; }
  .status { display: flex; gap: 10px; align-items: flex-start; }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; flex: none; background: var(--muted); }
  .dot.ready { background: var(--ok); } .dot.connecting { background: var(--warn); } .dot.error { background: var(--bad); }
  .status small { color: var(--muted); display: block; }
  button, input, select {
    font: inherit; color: inherit; border-radius: var(--radius);
  }
  button {
    border: 1px solid var(--line); background: transparent; padding: 7px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  input, select { border: 1px solid var(--line); background: var(--bg); padding: 7px 9px; width: 100%; min-width: 0; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .hint { color: var(--muted); font-size: 12.5px; margin: 0; }
  .results button, .spots .spot { text-align: left; width: 100%; }
  .results { display: flex; flex-direction: column; gap: 4px; }
  .spots { display: flex; flex-direction: column; gap: 4px; }
  .spot { display: flex; align-items: center; gap: 6px; }
  .spot button.go { flex: 1; text-align: left; border: none; padding: 6px 4px; }
  .spot button.del { border: none; color: var(--muted); padding: 4px 8px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .seg button { flex: 1; border: none; border-radius: 0; }
  .seg button.on { background: var(--ink); color: var(--panel); }
  label.check { display: flex; gap: 8px; align-items: center; }
  label.check input { width: auto; }
  .update { border: 1px solid var(--accent); border-radius: var(--radius); padding: 12px; }
  .update .hint { white-space: pre-line; max-height: 120px; overflow-y: auto; }
  #map { height: 100vh; }
  .toast {
    position: fixed; right: 16px; bottom: 16px; z-index: 1000; max-width: 360px;
    background: var(--ink); color: var(--panel); padding: 10px 14px; border-radius: var(--radius);
    opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: none; }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 55vh; height: auto; }
    aside { border-right: none; border-bottom: 1px solid var(--line); }
    #map { height: 55vh; }
  }
</style>
</head>
<body>
<aside>
  <h1>Wander<span>pin</span> <small id="ver" style="font-size:12px;font-weight:400;color:var(--muted)"></small></h1>

  <section id="updateBox" class="update" hidden>
    <b id="updateTitle"></b>
    <p class="hint" id="updateNotes"></p>
    <button id="updateBtn" class="primary">Update now</button>
  </section>

  <section>
    <div class="status"><div class="dot" id="dot"></div><div><b id="stateText">Starting…</b><small id="stateMsg"></small></div></div>
    <div class="row">
      <button id="tunnelBtn">Start phone connection</button>
      <button id="connectBtn" class="primary">Connect</button>
    </div>
  </section>

  <section>
    <h2>Go to a place</h2>
    <div class="row"><input id="q" placeholder="Search a city, address, landmark"><button id="searchBtn" style="flex:none">Search</button></div>
    <div class="results" id="results"></div>
    <div class="row"><input id="lat" placeholder="Latitude"><input id="lon" placeholder="Longitude"></div>
    <p class="hint">Or click anywhere on the map.</p>
    <div class="row">
      <button id="setBtn" class="primary">Set location</button>
      <button id="clearBtn">Real GPS</button>
    </div>
  </section>

  <section>
    <h2>Saved spots</h2>
    <div class="row"><input id="spotName" placeholder="Name this spot"><button id="saveSpot" style="flex:none">Save</button></div>
    <div class="spots" id="spots"></div>
  </section>

  <section>
    <h2>Route</h2>
    <p class="hint">Turn on route mode, then click points on the map in order.</p>
    <label class="check"><input type="checkbox" id="routeMode"> Route mode</label>
    <div class="seg" id="speed">
      <button data-v="walk" class="on">Walk</button><button data-v="bike">Bike</button><button data-v="drive">Drive</button>
    </div>
    <label class="check"><input type="checkbox" id="roads" checked> Follow roads</label>
    <label class="check"><input type="checkbox" id="loop"> Go back and forth</label>
    <div class="row">
      <button id="playBtn" class="primary">Play route</button>
      <button id="stopBtn">Stop</button>
      <button id="resetRoute">Clear points</button>
    </div>
    <p class="hint" id="routeInfo"></p>
  </section>
</aside>
<div id="map"></div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const api = async (path, method = "GET", body) => {
  const r = await fetch(path, {
    method,
    headers: method === "GET" ? {} : { "Content-Type": "application/json", "X-Wanderpin": "1" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || ("Error " + r.status));
  return data;
};
let toastTimer;
const toast = (msg) => {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3500);
};
const busy = async (btn, fn) => {
  btn.disabled = true;
  try { await fn(); } catch (e) { toast(e.message); } finally { btn.disabled = false; }
};

// ---- map
const map = L.map("map", { zoomControl: true }).setView([40.758, -73.9855], 13);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "&copy; OpenStreetMap contributors",
}).addTo(map);
const pinIcon = L.divIcon({
  className: "", iconSize: [22, 22], iconAnchor: [11, 11],
  html: '<div style="width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>',
});
const target = L.marker([0, 0], { opacity: 0.5 });
const live = L.marker([0, 0], { icon: pinIcon });
let routePts = [];
const routeLine = L.polyline([], { color: "#c4532d", weight: 4, opacity: 0.8 }).addTo(map);
const routeDots = L.layerGroup().addTo(map);

function pick(lat, lon, zoom) {
  $("lat").value = lat.toFixed(6); $("lon").value = lon.toFixed(6);
  target.setLatLng([lat, lon]).addTo(map);
  if (zoom) map.setView([lat, lon], zoom);
}
map.on("click", (e) => {
  if ($("routeMode").checked) {
    routePts.push([e.latlng.lat, e.latlng.lng]);
    L.circleMarker(e.latlng, { radius: 5, color: "#c4532d" }).addTo(routeDots);
    routeLine.setLatLngs(routePts);
    $("routeInfo").textContent = routePts.length + " point(s)";
  } else {
    pick(e.latlng.lat, e.latlng.lng);
  }
});

// ---- status
let lastPos = null;
async function refresh() {
  try {
    const s = await api("/api/status");
    $("dot").className = "dot " + s.state;
    $("stateText").textContent = s.state === "ready"
      ? `${s.device.name}${s.device.ios ? " · iOS " + s.device.ios : ""}`
      : { idle: "Not connected", connecting: "Connecting…", error: "Needs attention" }[s.state];
    $("stateMsg").textContent = s.state === "ready"
      ? (s.position ? "Showing a fake location" : "Using real GPS") : s.message;
    $("tunnelBtn").style.display = s.tunnel_running ? "none" : "";
    $("ver").textContent = "v" + s.version;
    if (s.update && s.update.available && !updating) {
      $("updateBox").hidden = false;
      $("updateTitle").textContent = `Version ${s.update.version} is available`;
      $("updateNotes").textContent = s.update.notes || "";
    }
    if (s.position) {
      live.setLatLng(s.position).addTo(map);
      if (!lastPos) map.panTo(s.position);
    } else live.remove();
    lastPos = s.position;
    if (s.route) $("routeInfo").textContent =
      `Moving… ${(s.route.done_m / 1000).toFixed(2)} of ${(s.route.total_m / 1000).toFixed(2)} km`;
  } catch { $("stateText").textContent = "Wanderpin stopped"; $("dot").className = "dot error"; }
}
setInterval(refresh, 1000); refresh();

// ---- updates
let updating = false;
$("updateBtn").onclick = (e) => busy(e.target, async () => {
  updating = true;
  $("updateTitle").textContent = "Downloading update…";
  const from = $("ver").textContent;
  try {
    await api("/api/update", "POST");
  } catch (err) { updating = false; throw err; }
  $("updateTitle").textContent = "Restarting Wanderpin…";
  $("updateNotes").textContent = "A new Wanderpin window will open. You can close the old one if it stays.";
  for (let i = 0; i < 60; i++) {           // wait for the new version, then reload
    await new Promise((r) => setTimeout(r, 1000));
    try {
      const s = await (await fetch("/api/status")).json();
      if ("v" + s.version !== from) { location.reload(); return; }
    } catch {}
  }
  toast("Restart is taking a while. Open Wanderpin again from the Start menu.");
});

// ---- connection
$("tunnelBtn").onclick = (e) => busy(e.target, async () => {
  await api("/api/tunnel", "POST");
  toast("Approve the admin prompt, then click Connect.");
});
$("connectBtn").onclick = (e) => busy(e.target, async () => {
  const s = await api("/api/connect", "POST");
  toast(s.state === "ready" ? "Connected." : s.message);
  refresh();
});

// ---- set / clear
$("setBtn").onclick = (e) => busy(e.target, async () => {
  const lat = parseFloat($("lat").value), lon = parseFloat($("lon").value);
  if (!isFinite(lat) || !isFinite(lon)) throw new Error("Pick a place on the map or type coordinates.");
  await api("/api/set", "POST", { lat, lon });
  toast("Location set."); refresh();
});
$("clearBtn").onclick = (e) => busy(e.target, async () => {
  await api("/api/clear", "POST"); toast("Back to your real GPS."); refresh();
});

// ---- search (OpenStreetMap Nominatim)
async function search() {
  const q = $("q").value.trim(); if (!q) return;
  const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=5&q=" + encodeURIComponent(q));
  const items = await r.json();
  const box = $("results"); box.innerHTML = "";
  if (!items.length) { box.textContent = "No matches."; return; }
  for (const it of items) {
    const b = document.createElement("button");
    b.textContent = it.display_name;
    b.onclick = () => { pick(+it.lat, +it.lon, 15); box.innerHTML = ""; $("spotName").value = it.display_name.split(",")[0]; };
    box.appendChild(b);
  }
}
$("searchBtn").onclick = (e) => busy(e.target, search);
$("q").onkeydown = (e) => { if (e.key === "Enter") busy($("searchBtn"), search); };

// ---- spots
function drawSpots(list) {
  const box = $("spots"); box.innerHTML = "";
  if (!list.length) { box.innerHTML = '<p class="hint">Nothing saved yet.</p>'; return; }
  for (const s of list) {
    const row = document.createElement("div"); row.className = "spot";
    const go = document.createElement("button"); go.className = "go"; go.textContent = s.name;
    go.onclick = () => pick(s.lat, s.lon, 15);
    const del = document.createElement("button"); del.className = "del"; del.textContent = "Remove";
    del.onclick = () => busy(del, async () => drawSpots(await api("/api/spots/" + encodeURIComponent(s.name), "DELETE")));
    row.append(go, del); box.appendChild(row);
  }
}
api("/api/spots").then(drawSpots).catch(() => {});
$("saveSpot").onclick = (e) => busy(e.target, async () => {
  const name = $("spotName").value.trim();
  const lat = parseFloat($("lat").value), lon = parseFloat($("lon").value);
  if (!name) throw new Error("Give the spot a name.");
  if (!isFinite(lat) || !isFinite(lon)) throw new Error("Pick a place first.");
  drawSpots(await api("/api/spots", "POST", { name, lat, lon }));
  $("spotName").value = "";
});

// ---- routes
let speed = "walk";
$("speed").onclick = (e) => {
  if (!e.target.dataset.v) return;
  speed = e.target.dataset.v;
  for (const b of $("speed").children) b.classList.toggle("on", b === e.target);
};
$("resetRoute").onclick = () => { routePts = []; routeLine.setLatLngs([]); routeDots.clearLayers(); $("routeInfo").textContent = ""; };
async function roadPath(pts) {
  // Public OSRM demo server: fine for personal use, not for heavy traffic.
  const profile = speed === "drive" ? "driving" : speed === "bike" ? "cycling" : "foot";
  const coords = pts.map(([la, lo]) => lo + "," + la).join(";");
  const r = await fetch(`https://router.project-osrm.org/route/v1/${profile}/${coords}?overview=full&geometries=geojson`);
  const j = await r.json();
  if (j.code !== "Ok") throw new Error("Couldn't find a road route; try unticking Follow roads.");
  return j.routes[0].geometry.coordinates.map(([lo, la]) => [la, lo]);
}
$("playBtn").onclick = (e) => busy(e.target, async () => {
  if (routePts.length < 2) throw new Error("Click at least two points in route mode.");
  const path = $("roads").checked ? await roadPath(routePts) : routePts;
  routeLine.setLatLngs(path);
  await api("/api/route", "POST", { points: path.map(([lat, lon]) => ({ lat, lon })), speed, loop: $("loop").checked });
  toast("Route started."); refresh();
});
$("stopBtn").onclick = (e) => busy(e.target, async () => {
  await api("/api/route/stop", "POST"); $("routeInfo").textContent = "Stopped."; refresh();
});
</script>
</body>
</html>
